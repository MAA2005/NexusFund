<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusFund — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #030712;
      color: #f9fafb;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 3rem;
      color: #fff;
    }
    .logo span { color: #6366f1; }

    .icon {
      width: 72px;
      height: 72px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon svg { width: 36px; height: 36px; color: #6366f1; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #f9fafb;
    }

    p {
      font-size: 0.95rem;
      color: #9ca3af;
      max-width: 340px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4338ca; }

    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #4b5563;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="logo">Nexus<span>Fund</span></div>

  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3l1.664 1.664M21 21l-1.5-1.5m-5.485-1.242L13 17h-2l-2-1.758V9a2 2 0 012-2h2a2 2 0 012 2v5.257M3 7a4 4 0 014-4m10 0a4 4 0 014 4M6.343 6.343A8 8 0 0112 4" />
    </svg>
  </div>

  <h1>You're offline</h1>
  <p>
    NexusFund needs an internet connection to load campaigns and process
    donations. Please check your connection and try again.
  </p>

  <button onclick="window.location.reload()">Try again</button>

  <p class="status">
    <span class="dot"></span>No internet connection
  </p>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
